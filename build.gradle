plugins {
    id 'net.minecraftforge.gradle' version '6.0.36'
    id 'eclipse'
    id 'maven-publish'
}

version = '1.1.3-forge-1.18.2'
group = 'online.kbpf'

base {
    archivesName = 'DG_LAB'
}

java {
    archivesBaseName = 'DG_LAB'
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

configurations {
    embed
    implementation.extendsFrom embed
    runtimeClasspath.extendsFrom embed
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: 'official', version: '1.18.2'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'dg_lab'
            mods {
                dg_lab {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'dg_lab'
            mods {
                dg_lab {
                    source sourceSets.main
                }
            }
        }

        gameTestServer {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'dg_lab'
            mods {
                dg_lab {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'dg_lab', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                dg_lab {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = 'https://maven.minecraftforge.net' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.18.2-40.3.11'
    // ZXing for QR code generation - packaged with the mod
    embed 'com.google.zxing:core:3.5.3'
    // Java-WebSocket for WebSocket server - use fg.deobf for Forge compatibility
    embed fg.deobf('org.java-websocket:Java-WebSocket:1.5.7')
    // Note: commons-lang3 dependency removed to avoid Forge conflicts

    // Provide updated Forge unsafe helpers for older launchers
    runtimeOnly files('libs/unsafe-0.9.2.jar')
}

jar {
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
            "Specification-Title": "DG_LAB",
            "Specification-Vendor": "kbpf",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": project.jar.archiveVersion,
            "Implementation-Vendor": "kbpf",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    from {
        configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
    }

    from {
        fileTree('libs').include('*.jar').collect { zipTree(it) }
    }
}

// 鍒涘缓涓€涓寘鍚緷璧栫殑fat jar
task fatJar(type: Jar) {
    description = "Creates a fat jar with all dependencies"
    group = "build"

    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE
    manifest.from jar.manifest
    archiveClassifier.set("with-dependencies")

    from sourceSets.main.output

    dependsOn configurations.runtimeClasspath
    from {
        (configurations.runtimeClasspath.findAll { it.name.endsWith('.jar') }).collect { zipTree(it) }
    }

    // 鐗规畩澶勭悊libs鐩綍涓殑jar鏂囦欢
    from fileTree('libs').include('*.jar').collect { zipTree(it) }
}


jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    // Compile sources with UTF-8 to match project guidelines
    options.encoding = 'UTF-8'
}




